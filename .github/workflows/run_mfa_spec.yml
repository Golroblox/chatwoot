name: Run MFA Tests
permissions:
  contents: read

on:
  pull_request:

# If two pushes happen within a short time in the same PR, cancel the run of the oldest push
concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

# Golrox: in a container job the runner's default shell is sh; GitHub-hosted runs these steps with bash.
defaults:
  run:
    shell: bash -e {0}

# Golrox: every job runs on our VM (runner prod-chatwoot, label chatwoot), not GitHub-hosted (blocked for the org, billing).
jobs:
  test:
    runs-on: [self-hosted, chatwoot]
    # Golrox: VM runner, in a container (no setup-ruby: it needs an Ubuntu host). Gems and the pnpm store stay on the VM.
    container:
      image: ruby:3.4.4-bookworm
      # Golrox: the VM also runs prod. Low CPU weight: prod wins under contention. OOM: CI dies first, never Postgres.
      options: --cpu-shares=256 --oom-score-adj=1000
      volumes:
        - /root/ci-cache/chatwoot/bundle:/bundle
        - /root/ci-cache/chatwoot/pnpm-store:/pnpm-store
    # Only run if MFA test keys are available
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'chatwoot/chatwoot' && github.actor != 'dependabot[bot]')

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --cpu-shares=256 --oom-score-adj=1000
      redis:
        image: redis
        options: --entrypoint redis-server --cpu-shares=256 --oom-score-adj=1000

    env:
      RAILS_ENV: test
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379
      BUNDLE_PATH: /bundle
      npm_config_store_dir: /pnpm-store
      # Active Record encryption keys required for MFA - test keys only, not for production use
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: 'test_key_a6cde8f7b9c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7'
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: 'test_key_b7def9a8c0d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d8'
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: 'test_salt_c8efa0b9d1e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d9'

    steps:
      - uses: actions/checkout@v4

      - name: Bundle install
        run: bundle install --jobs 8 --retry 3

      - name: Create database
        run: bundle exec rake db:create

      - name: Install pgvector extension
        run: |
          PGPASSWORD="" psql -h postgres -U postgres -d chatwoot_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Seed database
        run: bundle exec rake db:schema:load

      - name: Run MFA-related backend tests
        run: |
          bundle exec rspec \
            spec/services/mfa/token_service_spec.rb \
            spec/services/mfa/authentication_service_spec.rb \
            spec/requests/api/v1/profile/mfa_controller_spec.rb \
            spec/controllers/devise_overrides/sessions_controller_spec.rb \
            spec/models/application_record_external_credentials_encryption_spec.rb \
            --profile=10 \
            --format documentation
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Run MFA-related tests in user_spec
        run: |
          # Run specific MFA-related tests from user_spec
          bundle exec rspec spec/models/user_spec.rb \
            -e "two factor" \
            -e "2FA" \
            -e "MFA" \
            -e "otp" \
            -e "backup code" \
            --profile=10 \
            --format documentation
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mfa-test-logs
          path: |
            log/test.log
            tmp/screenshots/
