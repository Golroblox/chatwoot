name: Deploy Golrox (golpan)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-golpan
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: [self-hosted, staging-vm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync source & compose up on golpan VM (local)
        run: sudo /usr/local/bin/golpan-deploy chatwoot "$GITHUB_WORKSPACE"
