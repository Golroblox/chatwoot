# ref: https://github.com/amannn/action-semantic-pull-request
# ensure PR title is in semantic format

name: "Lint PR"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

# Golrox: every job runs on our VM (runner prod-chatwoot, label chatwoot), not GitHub-hosted (blocked for the org, billing).
jobs:
  main:
    name: Validate PR title
    runs-on: [self-hosted, chatwoot]
    container:
      image: node:24-bookworm-slim
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
